name: VPNConnect
options:
  bundleIdPrefix: com.vpnconnect
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  VPNConnect:
    type: application
    platform: macOS
    sources:
      - path: VPNConnect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vpnconnect.app
        INFOPLIST_FILE: VPNConnect/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
        PRODUCT_NAME: "VPN Connect"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
        LSUIElement: "YES"
